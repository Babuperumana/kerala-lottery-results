name: Auto Update Lottery Result

on:
  schedule:
    # 09:30 AM to 11:00 AM UTC corresponds to 03:00 PM to 04:30 PM IST
    # Runs every 5 minutes from 09:30 to 09:55
    - cron: '30/5 9 * * *'
    # Runs every 5 minutes from 10:00 to 10:55
    - cron: '*/5 10 * * *'
    # Runs exactly at 11:00
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python LotteryApp/scraper.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add LotteryApp/data/result.json
          git commit -m "Auto-update lottery results" || exit 0
          git push
